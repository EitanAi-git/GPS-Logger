<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Logger</title>
<style>
  html, body { margin: 0; background: #000; color: #ff9933; font-family: monospace; font-size: 14px; }
  #log div { padding: 2px 6px; border-bottom: 1px solid #331a00; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div id="log"></div>
<script>
  var log = document.getElementById('log');
  var n = 0;

  function line(text) {
    var d = document.createElement('div');
    d.textContent = new Date().toLocaleTimeString() + '  ' + text;
    log.insertBefore(d, log.firstChild);
  }

  function v(x) { return x === null || x === undefined ? 'unknown' : x; }

  if (!('geolocation' in navigator)) {
    line('Error: this browser does not support location');
  } else {
    line('Asking for location permission...');
    navigator.geolocation.watchPosition(function (p) {
      var c = p.coords;
      n++;
      line('Update ' + n +
        ' | Latitude: ' + v(c.latitude) +
        ' | Longitude: ' + v(c.longitude) +
        ' | Accuracy: ' + v(c.accuracy) + ' m' +
        ' | Altitude: ' + v(c.altitude) + ' m' +
        ' | Altitude accuracy: ' + v(c.altitudeAccuracy) + ' m' +
        ' | Heading: ' + v(c.heading) + ' deg' +
        ' | Speed: ' + v(c.speed) + ' m/s' +
        ' | Fix time: ' + new Date(p.timestamp).toLocaleString());
    }, function (e) {
      line('Error ' + e.code + ': ' + e.message);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }
</script>
</body>
</html>
