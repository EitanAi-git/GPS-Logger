<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Logger</title>
<style>
  html, body { margin: 0; background: #222; color: #ddd; font-family: Roboto, "Segoe UI", sans-serif; font-size: 17px; }
  #bar { background: #9e9e9e; color: #bdbdbd; font-weight: bold; font-size: 17px; padding: 11px 12px; }
  #main { padding: 4px 0 0 1px; }
  #main div { line-height: 1.6; }
  .help { color: #4a90e2; font-style: italic; }
  .orange { color: #f0a030; }
  .hidden { display: none; }
  #log { margin-top: 1.1em; padding-left: 3px; color: #f0a030; }
  #log div { line-height: 1.38 !important; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<div id="bar">GPS Logger</div>
<div id="main">
  <div class="help">Help:</div>
  <div class="help" id="status">1. Please wait for GPS positioning...</div>
  <div id="coords">Coordinates: </div>
  <div class="loc" id="lon">Longitude: </div>
  <div class="loc" id="lat">Latitude: </div>
  <div id="alt">Altitude: </div>
  <div id="acc">Accuracy: </div>
  <div id="altacc">Altitude accuracy: </div>
  <div id="spd">Speed: </div>
  <div id="hdg">Heading (compass): </div>
  <div id="dir">Direction of travel: </div>
  <div id="time">Last fix: </div>
  <div class="orange" id="sats">Number of satellites detected: N/A</div>
  <div class="orange" id="fixes">Number of fixes received: 0</div>
  <div id="log"></div>
</div>
<script>
  function $(id) { return document.getElementById(id); }
  var log = $('log');
  var n = 0;
  var lastLat = null, lastLon = null;
  var hide = false;
  try { hide = localStorage.getItem('hideCoords') === '1'; } catch (e) {}

  // Tap the coordinates line to hide/show your location
  function showCoords() {
    $('lon').className = $('lat').className = hide ? 'loc hidden' : 'loc';
    $('coords').textContent = hide ? 'Coordinates: hidden (tap to show)'
      : 'Coordinates: ' + (lastLat === null ? '' : lastLat.toFixed(6) + ', ' + lastLon.toFixed(6));
  }
  $('coords').onclick = function () {
    hide = !hide;
    try { localStorage.setItem('hideCoords', hide ? '1' : '0'); } catch (e) {}
    showCoords();
  };
  showCoords();

  // Compass: which way the phone points, works at any tilt
  function compass(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === 'number') {
      h = e.webkitCompassHeading;
    } else if (e.absolute !== false && e.alpha !== null) {
      var r = Math.PI / 180, a = e.alpha * r, b = e.beta * r, g = e.gamma * r;
      if (Math.abs(e.beta) < 45) {
        h = 360 - e.alpha; // lying flat: direction the top of the phone points
      } else {
        // held up: direction the back camera points
        var vx = -Math.cos(a) * Math.sin(g) - Math.sin(a) * Math.sin(b) * Math.cos(g);
        var vy = -Math.sin(a) * Math.sin(g) + Math.cos(a) * Math.sin(b) * Math.cos(g);
        h = Math.atan2(vx, vy) / r;
      }
      h -= (screen.orientation && screen.orientation.angle) || 0;
    }
    if (h === null || isNaN(h)) return;
    h = ((h % 360) + 360) % 360;
    var names = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    $('hdg').textContent = 'Heading (compass): ' + h.toFixed(0) + '\u00B0 ' + names[Math.round(h / 45) % 8];
  }
  if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', compass);
  } else {
    window.addEventListener('deviceorientation', compass);
  }
  // iPhone needs a tap before it allows the compass
  document.addEventListener('click', function () {
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
      DeviceOrientationEvent.requestPermission().catch(function () {});
    }
  });
  $('hdg').textContent = 'Heading (compass): waiting for compass...';

  function dms(deg, pos, neg) {
    var hemi = deg >= 0 ? pos : neg;
    deg = Math.abs(deg);
    var d = Math.floor(deg);
    var mFull = (deg - d) * 60;
    var m = Math.floor(mFull);
    var s = Math.round((mFull - m) * 60);
    if (s === 60) { s = 0; m++; }
    if (m === 60) { m = 0; d++; }
    return d + '\u00B0' + m + '’' + s + '”' + hemi;
  }

  function num(x, digits, unit) {
    return x === null || x === undefined || isNaN(x) ? 'unknown' : x.toFixed(digits) + unit;
  }

  if (!('geolocation' in navigator)) {
    $('status').textContent = '1. This browser does not support location';
  } else {
    navigator.geolocation.watchPosition(function (p) {
      var c = p.coords;
      n++;
      $('status').textContent = '1. GPS positioning OK';
      lastLat = c.latitude; lastLon = c.longitude;
      showCoords();
      $('lon').textContent = 'Longitude: ' + dms(c.longitude, 'E', 'W');
      $('lat').textContent = 'Latitude: ' + dms(c.latitude, 'N', 'S');
      $('alt').textContent = 'Altitude: ' + num(c.altitude, 2, ' m');
      $('acc').textContent = 'Accuracy: ' + num(c.accuracy, 2, ' m');
      $('altacc').textContent = 'Altitude accuracy: ' +
        (c.altitudeAccuracy === null ? 'not provided by this phone' : num(c.altitudeAccuracy, 2, ' m'));
      $('spd').textContent = 'Speed: ' + num(c.speed, 2, ' m/s');
      $('dir').textContent = 'Direction of travel: ' + num(c.heading, 0, '\u00B0');
      $('time').textContent = 'Last fix: ' + new Date(p.timestamp).toLocaleTimeString();
      $('fixes').textContent = 'Number of fixes received: ' + n;
      var d = document.createElement('div');
      d.textContent = 'GpsFix' + (n - 1) + ' ACC:' + num(c.accuracy, 1, '') + ' SPD:' + num(c.speed, 1, '');
      log.insertBefore(d, log.firstChild);
    }, function (e) {
      var msg = e.message || ['', 'Location permission denied', 'Position unavailable', 'Timed out'][e.code] || 'Unknown error';
      $('status').textContent = '1. Error: ' + msg;
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }
</script>
</body>
</html>
