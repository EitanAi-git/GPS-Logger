<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Logger</title>
<style>
  html, body { margin: 0; background: #000; color: #ff9933; font-family: sans-serif; font-size: 20px; }
  body { padding: 4px 6px; }
  div { line-height: 1.35; white-space: pre-wrap; word-break: break-all; }
  #log { margin-top: 1em; padding-left: 4px; }
  #log div { white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<div>Help:</div>
<div id="status">1. Please wait for GPS positioning...</div>
<div id="lon">Longitude: </div>
<div id="lat">Latitude: </div>
<div id="alt">Altitude: </div>
<div id="acc">Accuracy: </div>
<div id="sats">Number of satellites detected: not available in a browser</div>
<div id="log"></div>
<script>
  function $(id) { return document.getElementById(id); }
  var log = $('log');
  var n = 0;

  function dms(deg, pos, neg) {
    var hemi = deg >= 0 ? pos : neg;
    deg = Math.abs(deg);
    var d = Math.floor(deg);
    var mFull = (deg - d) * 60;
    var m = Math.floor(mFull);
    var s = Math.round((mFull - m) * 60);
    if (s === 60) { s = 0; m++; }
    if (m === 60) { m = 0; d++; }
    return d + '°' + m + '’' + s + '”' + hemi;
  }

  function line(text) {
    var d = document.createElement('div');
    d.textContent = text;
    log.appendChild(d);
  }

  if (!('geolocation' in navigator)) {
    $('status').textContent = 'This browser does not support location';
  } else {
    navigator.geolocation.watchPosition(function (p) {
      var c = p.coords;
      n++;
      $('status').textContent = '1. GPS positioning OK';
      $('lon').textContent = 'Longitude: ' + dms(c.longitude, 'E', 'W');
      $('lat').textContent = 'Latitude: ' + dms(c.latitude, 'N', 'S');
      $('alt').textContent = 'Altitude: ' + (c.altitude === null ? 'unknown' : c.altitude.toFixed(2) + ' m');
      $('acc').textContent = 'Accuracy: ' + c.accuracy.toFixed(2) + ' m';
      line('GpsFix' + n + ' ACC:' + c.accuracy.toFixed(1) +
        ' SPD:' + (c.speed === null ? '-' : c.speed.toFixed(1)));
    }, function (e) {
      var msg = e.message || ['', 'Location permission denied', 'Position unavailable', 'Timed out'][e.code] || 'Unknown error';
      $('status').textContent = 'Error: ' + msg;
      line('Error: ' + msg);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }
</script>
</body>
</html>
